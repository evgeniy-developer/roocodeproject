<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Screen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="screen-container">
    <header class="status-bar">
      <span class="time">9:41</span>
      <div class="status-icons">
        <svg class="icon icon-signal" viewBox="0 0 18 12" width="18" height="12">
          <path fill="currentColor" d="M1 11h2V9H1v2zm4 0h2V7H5v4zm4 0h2V4H9v7zm4 0h2V1h-2v10z"/>
        </svg>
        <svg class="icon icon-wifi" viewBox="0 0 16 12" width="16" height="12">
          <path fill="currentColor" d="M8 12a1.5 1.5 0 1 1 0-3 1.5 1.5 0 0 1 0 3zm-3.5-3.5a5 5 0 0 1 7 0l-1.2 1.2a3.3 3.3 0 0 0-4.6 0L4.5 8.5zm-2.5-2.5a8.5 8.5 0 0 1 12 0l-1.2 1.2a6.8 6.8 0 0 0-9.6 0L2 6zm-2-2a11.3 11.3 0 0 1 16 0l-1.2 1.2a9.6 9.6 0 0 0-13.6 0L0 4z"/>
        </svg>
        <svg class="icon icon-battery" viewBox="0 0 25 12" width="25" height="12">
          <rect x="0.5" y="0.5" width="21" height="11" rx="2.5" fill="none" stroke="currentColor"/>
          <rect x="2" y="2" width="15" height="8" rx="1" fill="currentColor"/>
          <path d="M23 4v4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </header>

    <main class="content">
      <img src="logo.png" alt="Logo" class="logo">
    </main>

    <footer class="footer">
      <button class="btn-take-a-sip">Take a Sip</button>
    </footer>
  </div>
</body>
</html>
